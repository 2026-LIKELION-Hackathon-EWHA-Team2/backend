name: Django CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests with coverage
        run: python -m coverage run manage.py test --noinput --verbosity 2
      - name: Generate coverage reports
        if: always()
        run: |
          if [ -f .coverage ]; then
            python -m coverage report
            python -m coverage xml
            python -m coverage html
            echo '### Test coverage' >> "$GITHUB_STEP_SUMMARY"
            echo 'See the test step for test count, failures, and duration.' >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14